<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule by Class</title>
<!-- Angular Material via CDN -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary:    #1a73e8;
    --primary-lt: #e8f0fe;
    --green:      #0f9d58;
    --green-lt:   #e6f4ea;
    --red:        #d93025;
    --red-lt:     #fce8e6;
    --yellow:     #f9ab00;
    --yellow-lt:  #fef7e0;
    --purple:     #673ab7;
    --purple-lt:  #ede7f6;
    --bg:         #f8f9fa;
    --card:       #ffffff;
    --text:       #202124;
    --muted:      #5f6368;
    --border:     #dadce0;
    --radius:     12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: 60px;
  }
  /* Top bar */
  .topbar {
    background: var(--primary);
    color: #fff;
    padding: 16px 24px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    position: sticky; top: 0; z-index: 100;
  }
  .topbar h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px; font-weight: 700;
  }
  .topbar .material-icons { font-size: 28px; }
  /* Search + filter bar */
  .toolbar {
    display: flex; gap: 12px; flex-wrap: wrap;
    align-items: center;
    padding: 16px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .search-wrap {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 7px 16px;
    flex: 1; min-width: 200px;
  }
  .search-wrap input {
    border: none; background: transparent;
    font-family: 'Roboto', sans-serif; font-size: 14px;
    outline: none; flex: 1; color: var(--text);
  }
  .search-wrap .material-icons { color: var(--muted); font-size: 20px; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    color: var(--muted);
    white-space: nowrap;
  }
  .filter-chip.active {
    background: var(--primary-lt);
    border-color: var(--primary);
    color: var(--primary);
  }
  /* Main content */
  .container { padding: 24px; max-width: 1100px; margin: 0 auto; }
  /* Class card */
  .class-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    transition: box-shadow .2s;
  }
  .class-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .class-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: background .15s;
  }
  .class-header:hover { background: var(--bg); }
  .class-header.open { border-bottom-color: var(--border); }
  .class-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px; font-weight: 700;
  }
  .class-meta { display: flex; align-items: center; gap: 10px; }
  .match-count-badge {
    background: var(--primary-lt);
    color: var(--primary);
    font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 100px;
  }
  .expand-icon {
    color: var(--muted);
    transition: transform .2s;
  }
  .expand-icon.open { transform: rotate(180deg); }
  /* Match list */
  .match-list { padding: 0 20px 16px; }
  .match-item {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .match-item:last-child { border-bottom: none; }
  .sport-badge {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .match-info { flex: 1; }
  .match-name { font-weight: 500; font-size: 15px; margin-bottom: 4px; }
  .match-detail {
    display: flex; flex-wrap: wrap; gap: 10px;
    font-size: 13px; color: var(--muted);
  }
  .match-detail span { display: flex; align-items: center; gap: 4px; }
  .match-detail .material-icons { font-size: 15px; }
  /* Lessons missed */
  .lessons-missed {
    margin-top: 8px;
  }
  .lessons-label {
    font-size: 12px; font-weight: 600; color: var(--red);
    margin-bottom: 4px;
    display: flex; align-items: center; gap: 4px;
  }
  .lessons-label .material-icons { font-size: 14px; }
  .lesson-chip {
    display: inline-block;
    background: var(--red-lt);
    color: var(--red);
    font-size: 12px; font-weight: 500;
    padding: 2px 8px; border-radius: 4px;
    margin: 2px 4px 2px 0;
  }
  .no-lessons {
    font-size: 12px;
    color: var(--green);
    display: flex; align-items: center; gap: 4px;
  }
  .no-lessons .material-icons { font-size: 14px; }
  /* Empty & loading states */
  .state-container {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px 20px; text-align: center;
  }
  .state-icon { font-size: 64px; margin-bottom: 16px; }
  .state-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .state-msg { color: var(--muted); font-size: 14px; }
  .spinner-wrap {
    display: flex; flex-direction: column; align-items: center;
    padding: 80px;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <span class="material-icons">calendar_today</span>
  <h1>Schedule by Class</h1>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="material-icons">search</span>
    <input id="search" type="text" placeholder="Search class or sport…" oninput="applyFilters()">
  </div>
  <div id="sport-filters" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  <button class="filter-chip active" id="chip-all" onclick="selectSport('all')">All Sports</button>
</div>

<div class="container" id="content">
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <div style="color:var(--muted);font-size:14px;">Loading schedule…</div>
  </div>
</div>

<script>
  const SPORT_COLORS = [
    { bg: '#e8f0fe', text: '#1a73e8' },
    { bg: '#e6f4ea', text: '#0f9d58' },
    { bg: '#fef7e0', text: '#b06000' },
    { bg: '#fce8e6', text: '#d93025' },
    { bg: '#ede7f6', text: '#673ab7' },
    { bg: '#e0f7fa', text: '#00838f' },
    { bg: '#fce4ec', text: '#c2185b' },
    { bg: '#f3e5f5', text: '#8e24aa' },
  ];
  const sportColorMap = {};

  function getSportColor(sport) {
    if (!sportColorMap[sport]) {
      const idx = Object.keys(sportColorMap).length % SPORT_COLORS.length;
      sportColorMap[sport] = SPORT_COLORS[idx];
    }
    return sportColorMap[sport];
  }

  let allData        = {};
  let activeSport    = 'all';
  let expandedClass  = null;

  // ── Load data from server ─────────────────────────────────
  google.script.run
    .withSuccessHandler(function(data) {
      allData = data || {};
      renderSportFilters();
      renderCards();
    })
    .withFailureHandler(function(err) {
      document.getElementById('content').innerHTML =
        `<div class="state-container">
          <div class="state-icon">⚠️</div>
          <div class="state-title">Could not load data</div>
          <div class="state-msg">${err.message}</div>
        </div>`;
    })
    .DisplayByClass();

  // ── Sport filter chips ────────────────────────────────────
  function renderSportFilters() {
    const sports = new Set();
    Object.values(allData).forEach(matches =>
      matches.forEach(m => sports.add(m.sport))
    );
    const container = document.getElementById('sport-filters');
    container.innerHTML = '';
    sports.forEach(sport => {
      const col = getSportColor(sport);
      const chip = document.createElement('button');
      chip.className = 'filter-chip';
      chip.id = 'chip-' + sport;
      chip.textContent = sport;
      chip.onclick = () => selectSport(sport);
      container.appendChild(chip);
    });
  }

  function selectSport(sport) {
    activeSport = sport;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    const target = document.getElementById('chip-' + sport) || document.getElementById('chip-all');
    if (target) target.classList.add('active');
    renderCards();
  }

  // ── Render class cards ────────────────────────────────────
  function applyFilters() { renderCards(); }

  function renderCards() {
    const query   = document.getElementById('search').value.toLowerCase();
    const content = document.getElementById('content');

    const filtered = {};
    Object.entries(allData).forEach(([cls, matches]) => {
      if (query && !cls.toLowerCase().includes(query) &&
          !matches.some(m => m.sport.toLowerCase().includes(query) || m.name.toLowerCase().includes(query))) return;
      const filteredMatches = activeSport === 'all'
        ? matches
        : matches.filter(m => m.sport === activeSport);
      if (filteredMatches.length) filtered[cls] = filteredMatches;
    });

    if (!Object.keys(filtered).length) {
      content.innerHTML = `
        <div class="state-container">
          <div class="state-icon">🔍</div>
          <div class="state-title">No results found</div>
          <div class="state-msg">Try adjusting your search or filter.</div>
        </div>`;
      return;
    }

    content.innerHTML = '';
    Object.entries(filtered)
      .sort(([a], [b]) => a.localeCompare(b))
      .forEach(([cls, matches]) => {
        content.appendChild(buildClassCard(cls, matches));
      });
  }

  function buildClassCard(cls, matches) {
    const card = document.createElement('div');
    card.className = 'class-card';

    const isExpanded = expandedClass === cls;

    const header = document.createElement('div');
    header.className = 'class-header' + (isExpanded ? ' open' : '');
    header.innerHTML = `
      <div class="class-name">📚 ${cls}</div>
      <div class="class-meta">
        <span class="match-count-badge">${matches.length} match${matches.length !== 1 ? 'es' : ''}</span>
        <span class="material-icons expand-icon ${isExpanded ? 'open' : ''}">expand_more</span>
      </div>`;
    header.onclick = () => toggleCard(cls, card, header, matches);
    card.appendChild(header);

    if (isExpanded) {
      card.appendChild(buildMatchList(matches));
    }
    return card;
  }

  function toggleCard(cls, card, header, matches) {
    const existing = card.querySelector('.match-list');
    const icon     = header.querySelector('.expand-icon');
    if (existing) {
      existing.remove();
      header.classList.remove('open');
      icon.classList.remove('open');
      expandedClass = null;
    } else {
      header.classList.add('open');
      icon.classList.add('open');
      card.appendChild(buildMatchList(matches));
      expandedClass = cls;
    }
  }

  function buildMatchList(matches) {
    const list = document.createElement('div');
    list.className = 'match-list';

    matches.forEach(m => {
      const col = getSportColor(m.sport);
      const item = document.createElement('div');
      item.className = 'match-item';

      const lessonsHtml = m.lessonsAffected && m.lessonsAffected.length
        ? `<div class="lessons-missed">
            <div class="lessons-label">
              <span class="material-icons">warning</span>
              Lessons missed (${m.lessonsAffected.length}):
            </div>
            ${m.lessonsAffected.map(l =>
              `<span class="lesson-chip">${l.Subject || l.subject} (${l.StartTime || l.startTime}–${l.EndTime || l.endTime})</span>`
            ).join('')}
           </div>`
        : `<div class="no-lessons">
            <span class="material-icons">check_circle</span>
            No lessons affected
           </div>`;

      item.innerHTML = `
        <div class="sport-badge" style="background:${col.bg};color:${col.text};">${m.sport}</div>
        <div class="match-info">
          <div class="match-name">${m.name}</div>
          <div class="match-detail">
            <span><span class="material-icons">calendar_today</span>${formatDate(m.date)}</span>
            <span><span class="material-icons">schedule</span>${formatTime(m.startTime)} – ${formatTime(m.endTime)}</span>
            <span><span class="material-icons">location_on</span>${m.venue || 'TBC'}</span>
          </div>
          ${lessonsHtml}
        </div>`;
      list.appendChild(item);
    });
    return list;
  }

  // ── Helpers ───────────────────────────────────────────────
  function formatDate(d) {
    if (!d) return 'TBC';
    const dt = new Date(d);
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString('en-SG', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
  }
  function formatTime(t) {
    if (!t) return 'TBC';
    const s = t.toString();
    if (s.includes(':')) return s.slice(0,5);
    return t;
  }
</script>
</body>
</html>
