<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule by Event</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --primary:    #0f9d58;
    --primary-lt: #e6f4ea;
    --blue:       #1a73e8;
    --blue-lt:    #e8f0fe;
    --red:        #d93025;
    --yellow:     #f9ab00;
    --yellow-lt:  #fef7e0;
    --purple:     #673ab7;
    --bg:         #f8f9fa;
    --card:       #ffffff;
    --text:       #202124;
    --muted:      #5f6368;
    --border:     #dadce0;
    --radius:     12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: 60px;
  }
  .topbar {
    background: var(--primary);
    color: #fff; padding: 16px 24px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    position: sticky; top: 0; z-index: 100;
  }
  .topbar h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px; font-weight: 700;
  }
  .topbar .material-icons { font-size: 28px; }
  .toolbar {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    padding: 16px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .search-wrap {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 24px; padding: 7px 16px;
    flex: 1; min-width: 200px;
  }
  .search-wrap input {
    border: none; background: transparent;
    font-family: 'Roboto', sans-serif; font-size: 14px;
    outline: none; flex: 1; color: var(--text);
  }
  .search-wrap .material-icons { color: var(--muted); font-size: 20px; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 100px; padding: 6px 14px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .15s; color: var(--muted); white-space: nowrap;
  }
  .filter-chip.active {
    background: var(--primary-lt);
    border-color: var(--primary); color: var(--primary);
  }
  /* Date groupings */
  .date-group { margin-bottom: 28px; }
  .date-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px; font-weight: 700;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px; padding: 0 4px;
  }
  /* Event card */
  .event-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    transition: box-shadow .2s, transform .15s;
  }
  .event-card:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,.1);
    transform: translateY(-1px);
  }
  .event-top {
    display: flex; gap: 0; align-items: stretch;
  }
  .event-accent {
    width: 6px; flex-shrink: 0;
  }
  .event-body { padding: 18px 20px; flex: 1; }
  .event-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
  }
  .event-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px; font-weight: 700;
  }
  .sport-badge {
    padding: 4px 12px; border-radius: 100px;
    font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .event-meta {
    display: flex; flex-wrap: wrap; gap: 14px;
    font-size: 13px; color: var(--muted);
    margin-bottom: 14px;
  }
  .event-meta span { display: flex; align-items: center; gap: 5px; }
  .event-meta .material-icons { font-size: 16px; }
  /* Capacity bar */
  .capacity-section { margin-bottom: 14px; }
  .capacity-label {
    display: flex; justify-content: space-between;
    font-size: 12px; font-weight: 500; margin-bottom: 5px;
  }
  .capacity-label .cap-warn { color: var(--red); }
  .capacity-label .cap-ok   { color: var(--primary); }
  .progress-bar {
    height: 6px; background: var(--bg);
    border-radius: 100px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 100px;
    transition: width .4s ease;
  }
  /* Classes section */
  .classes-section {}
  .classes-label {
    font-size: 12px; font-weight: 600; color: var(--muted);
    margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
  }
  .classes-label .material-icons { font-size: 15px; }
  .classes-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .class-chip {
    background: var(--blue-lt); color: var(--blue);
    border-radius: 6px; padding: 3px 10px;
    font-size: 12px; font-weight: 600;
  }
  /* Empty & loading */
  .container { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .state-container {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px 20px; text-align: center;
  }
  .state-icon { font-size: 64px; margin-bottom: 16px; }
  .state-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .state-msg { color: var(--muted); font-size: 14px; }
  .spinner-wrap { display: flex; flex-direction: column; align-items: center; padding: 80px; }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <span class="material-icons">emoji_events</span>
  <h1>Schedule by Event</h1>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="material-icons">search</span>
    <input id="search" type="text" placeholder="Search event, sport, or venue…" oninput="applyFilters()">
  </div>
  <div id="sport-filters" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  <button class="filter-chip active" id="chip-all" onclick="selectSport('all')">All Sports</button>
</div>

<div class="container" id="content">
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <div style="color:var(--muted);font-size:14px;">Loading events…</div>
  </div>
</div>

<script>
  const SPORT_COLORS = [
    { bg: '#e8f0fe', text: '#1a73e8', accent: '#1a73e8' },
    { bg: '#e6f4ea', text: '#0f9d58', accent: '#0f9d58' },
    { bg: '#fef7e0', text: '#b06000', accent: '#f9ab00' },
    { bg: '#fce8e6', text: '#d93025', accent: '#d93025' },
    { bg: '#ede7f6', text: '#673ab7', accent: '#673ab7' },
    { bg: '#e0f7fa', text: '#00838f', accent: '#00838f' },
    { bg: '#fce4ec', text: '#c2185b', accent: '#c2185b' },
    { bg: '#f3e5f5', text: '#8e24aa', accent: '#8e24aa' },
  ];
  const sportColorMap = {};
  function getSportColor(sport) {
    if (!sportColorMap[sport]) {
      const idx = Object.keys(sportColorMap).length % SPORT_COLORS.length;
      sportColorMap[sport] = SPORT_COLORS[idx];
    }
    return sportColorMap[sport];
  }

  let allData     = [];
  let activeSport = 'all';

  google.script.run
    .withSuccessHandler(function(data) {
      allData = data || [];
      renderSportFilters();
      renderEvents();
    })
    .withFailureHandler(function(err) {
      document.getElementById('content').innerHTML =
        `<div class="state-container">
          <div class="state-icon">⚠️</div>
          <div class="state-title">Could not load data</div>
          <div class="state-msg">${err.message}</div>
        </div>`;
    })
    .DisplayByEvent();

  function renderSportFilters() {
    const sports    = new Set(allData.map(m => m.sport));
    const container = document.getElementById('sport-filters');
    container.innerHTML = '';
    sports.forEach(sport => {
      const chip = document.createElement('button');
      chip.className = 'filter-chip';
      chip.id = 'chip-' + sport;
      chip.textContent = sport;
      chip.onclick = () => selectSport(sport);
      container.appendChild(chip);
    });
  }

  function selectSport(sport) {
    activeSport = sport;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    const el = document.getElementById('chip-' + sport) || document.getElementById('chip-all');
    if (el) el.classList.add('active');
    renderEvents();
  }

  function applyFilters() { renderEvents(); }

  function renderEvents() {
    const query   = document.getElementById('search').value.toLowerCase();
    const content = document.getElementById('content');

    let filtered = allData.filter(m => {
      if (activeSport !== 'all' && m.sport !== activeSport) return false;
      if (query) {
        return m.name.toLowerCase().includes(query) ||
               m.sport.toLowerCase().includes(query) ||
               (m.venue || '').toLowerCase().includes(query) ||
               (m.classes || []).some(c => c.toLowerCase().includes(query));
      }
      return true;
    });

    // Sort by date then start time
    filtered.sort((a, b) => {
      const da = new Date(`${a.date} ${a.startTime}`);
      const db = new Date(`${b.date} ${b.startTime}`);
      return da - db;
    });

    if (!filtered.length) {
      content.innerHTML = `
        <div class="state-container">
          <div class="state-icon">🔍</div>
          <div class="state-title">No events found</div>
          <div class="state-msg">Try adjusting your search or filter.</div>
        </div>`;
      return;
    }

    // Group by date
    const byDate = {};
    filtered.forEach(m => {
      const dk = m.date || 'TBC';
      if (!byDate[dk]) byDate[dk] = [];
      byDate[dk].push(m);
    });

    content.innerHTML = '';
    Object.entries(byDate).forEach(([date, events]) => {
      const group = document.createElement('div');
      group.className = 'date-group';

      const label = document.createElement('div');
      label.className = 'date-label';
      label.textContent = formatDate(date);
      group.appendChild(label);

      events.forEach(m => group.appendChild(buildEventCard(m)));
      content.appendChild(group);
    });
  }

  function buildEventCard(m) {
    const col      = getSportColor(m.sport);
    const cap      = parseInt(m.capacity) || 0;
    const assigned = (m.classes || []).length;
    const fillPct  = cap > 0 ? Math.min(100, Math.round(assigned / cap * 100)) : 0;
    const capOk    = cap === 0 || assigned <= cap;
    const fillColor = !capOk ? '#d93025' : fillPct > 75 ? '#f9ab00' : '#0f9d58';

    const card = document.createElement('div');
    card.className = 'event-card';

    card.innerHTML = `
      <div class="event-top">
        <div class="event-accent" style="background:${col.accent};"></div>
        <div class="event-body">
          <div class="event-header">
            <div class="event-title">${m.name}</div>
            <div class="sport-badge" style="background:${col.bg};color:${col.text};">${m.sport}</div>
          </div>
          <div class="event-meta">
            <span><span class="material-icons">calendar_today</span>${formatDate(m.date)}</span>
            <span><span class="material-icons">login</span>Leave: ${formatTime(m.startTime)}</span>
            <span><span class="material-icons">logout</span>Return: ${formatTime(m.endTime)}</span>
            <span><span class="material-icons">location_on</span>${m.venue || 'TBC'}</span>
          </div>
          ${cap > 0 ? `
          <div class="capacity-section">
            <div class="capacity-label">
              <span>Capacity</span>
              <span class="${capOk ? 'cap-ok' : 'cap-warn'}">${assigned} / ${cap} classes ${!capOk ? '⚠️ Over capacity' : ''}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${fillPct}%;background:${fillColor};"></div>
            </div>
          </div>` : ''}
          <div class="classes-section">
            <div class="classes-label">
              <span class="material-icons">groups</span>
              Classes assigned (${assigned})
            </div>
            <div class="classes-chips">
              ${(m.classes || []).map(c =>
                `<span class="class-chip">${c}</span>`
              ).join('') || '<span style="color:var(--muted);font-size:13px;">None assigned yet</span>'}
            </div>
          </div>
        </div>
      </div>`;
    return card;
  }

  function formatDate(d) {
    if (!d || d === 'TBC') return 'Date TBC';
    const dt = new Date(d);
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString('en-SG', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  }
  function formatTime(t) {
    if (!t) return 'TBC';
    const s = t.toString();
    if (s.includes(':')) return s.slice(0,5);
    return t;
  }
</script>
</body>
</html>
